<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Style Portrait Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .tiktok-card {
            width: 100%;
            height: 100vh;
            background-color: #1e1e1e;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tiktok-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .top-overlay {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            font-size: 14px;
            text-align: center;
        }
        .overlay {
            position: absolute;
            top: 90%;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .overlay h2, .overlay p {
            margin: 0;
        }
        .overlay a {
            color: #1db954;
            text-decoration: none;
        }
        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: lime;
            padding: 5px;
            z-index: 100;
            max-width: 90%;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading"></div>
    <div id="portrait-container" style="display:none"></div>
    <div id="debug"></div>

    <script>
        let portraits = [];
        let currentIndex = -1;

        function debugLog(message) {
            document.getElementById('debug').innerHTML += `<div>${message}</div>`;
        }

        async function fetchPortraits() {
            try {
                const response = await fetch('tiktokcard-datacache.csv');
                const text = await response.text();
                const lines = text.split('\n').slice(1);

                portraits = lines.map(line => {
                    const [imageUrl, title, description, wikipediaLink] = line.split(',');
                    return { imageUrl, title, description, wikipediaLink };
                });

                debugLog('Data loaded from cache file.');
                document.getElementById('portrait-container').style.display = 'block';
                nextPortrait();
            } catch (error) {
                console.error('Error loading CSV data:', error);
                debugLog('Error: ' + error.message);
            }
        }

        function displayPortrait(portrait) {
            const container = document.getElementById('portrait-container');
            container.innerHTML = `
                <div class="tiktok-card">
                    <div class="top-overlay">Portrait from Koninklijke Bibliotheek</div>
                    <img src="${portrait.imageUrl}" alt="Portrait">
                    <div class="overlay">
                        <h2>${portrait.title}</h2>
                        <p>${portrait.description}</p>
                    </div>
                </div>`;
        }

        function nextPortrait() {
            currentIndex = (currentIndex + 1) % portraits.length;
            displayPortrait(portraits[currentIndex]);
        }

        fetchPortraits();
    </script>
</body>
</html>
