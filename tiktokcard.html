<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Style Portrait Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .tiktok-card {
            width: 100%;
            height: 100vh;
            background-color: #1e1e1e;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tiktok-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .top-overlay {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .overlay {
            position: absolute;
            top: 90%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            text-align: center;
        }
        .overlay h2 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }
        .overlay a {
            color: #1db954;
            text-decoration: none;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 5px solid #1e1e1e;
            border-top: 5px solid #1db954;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            z-index: 10;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading"></div>
    <div id="portrait-container" style="display:none"></div>

    <script>
        let portraits = [];
        let history = [];
        let currentIndex = -1;
        let startY = 0;
        let startX = 0;

        async function fetchPortraits(cmcontinue = '') {
            const apiUrl = `https://commons.wikimedia.org/w/api.php?action=query&list=categorymembers&cmtitle=Category:Portraits_from_Koninklijke_Bibliotheek&cmtype=file&cmlimit=500&format=json&origin=*${cmcontinue ? `&cmcontinue=${cmcontinue}` : ''}`;
            const response = await fetch(apiUrl);
            const data = await response.json();
            portraits = portraits.concat(data.query.categorymembers);
            if (data.continue && data.continue.cmcontinue) {
                await fetchPortraits(data.continue.cmcontinue);
            } else {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('portrait-container').style.display = 'block';
                nextPortrait();
            }
        }

        function displayPortrait(portrait) {
            document.getElementById('loading').style.display = 'block';
            const imageUrl = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(portrait.title.replace('File:', ''))}`;
            const pageUrl = `https://commons.wikimedia.org/wiki/${encodeURIComponent(portrait.title)}`;
            const title = portrait.title.replace('File:', '').replace(/_/g, ' ').replace(/\.[^/.]+$/, "");

            const container = document.getElementById('portrait-container');
            container.innerHTML = `
                <div class="tiktok-card">
                    <div class="top-overlay">Portrait from Koninklijke Bibliotheek</div>
                    <img src="${imageUrl}" alt="Portrait" onload="document.getElementById('loading').style.display='none';">
                    <div class="overlay">
                        <h2><a href="${pageUrl}" target="_blank">${title}</a></h2>
                    </div>
                </div>`;
        }

        function nextPortrait() {
            const randomIndex = Math.floor(Math.random() * portraits.length);
            history.push(randomIndex);
            currentIndex = history.length - 1;
            displayPortrait(portraits[randomIndex]);
        }

        function previousPortrait() {
            if (currentIndex > 0) {
                currentIndex--;
                displayPortrait(portraits[history[currentIndex]]);
            }
        }

        window.addEventListener('wheel', (event) => {
            if (event.deltaY > 0) {
                nextPortrait();
            } else if (event.deltaY < 0) {
                previousPortrait();
            }
        });

        window.addEventListener('touchstart', (event) => {
            startY = event.touches[0].clientY;
            startX = event.touches[0].clientX;
        });

        window.addEventListener('touchend', (event) => {
            const endY = event.changedTouches[0].clientY;
            const endX = event.changedTouches[0].clientX;
            const diffY = startY - endY;
            const diffX = startX - endX;

            if (diffY > 50) {
                nextPortrait();
            } else if (diffY < -50) {
                if (currentIndex === 0) {
                    location.reload();
                } else {
                    previousPortrait();
                }
            }
        });

        // Initial fetch
        fetchPortraits();
    </script>
</body>
</html>
