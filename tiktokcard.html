<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portraits from the collections of KB, national library of the Netherlands</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Source Sans Pro', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .tiktok-card {
            width: 100%;
            height: 100vh;
            background-color: #1e1e1e;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .zoomable {
            width: 100%;
            height: 100%;
            object-fit: cover;
            touch-action: none;
            transition: transform 0.2s ease;
        }
        .top-overlay, .overlay {
            position: absolute;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .top-overlay {
            top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            font-style: italic;
        }
        .overlay {
            bottom: 20px;
        }
        .overlay h2, .overlay p {
            margin: 5px 0;
        }
        .overlay a {
            color: #EF6079;
            text-decoration: underline;
            font-weight: 600;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 6px solid #ccc;
            border-top: 6px solid #EF6079;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading"></div>
    <div id="portrait-container" style="display:none"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const portraitContainer = document.getElementById('portrait-container');
            const loadingIndicator = document.getElementById('loading');
            const portraits = [];
            const history = [];
            let currentIndex = -1;

            async function fetchPortraits() {
                try {
                    const response = await fetch('tiktokcard-datacache.csv');
                    const text = await response.text();
                    const lines = text.trim().split('\n').slice(1);
                    lines.forEach(line => {
                        const parts = line.match(/(?:[^;]+|".*?")+/g);
                        if (parts && parts.length === 4) {
                            portraits.push({
                                imageUrl: parts[0],
                                title: parts[1],
                                description: parts[2],
                                wikipediaLink: parts[3]
                            });
                        }
                    });
                    loadingIndicator.style.display = 'none';
                    portraitContainer.style.display = 'block';
                    nextRandomPortrait();
                } catch (error) {
                    console.error('Error loading CSV data:', error);
                }
            }

            function displayPortrait(portrait) {
                portraitContainer.innerHTML = `
                    <div class="tiktok-card">
                        <div class="top-overlay">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/1/17/Logo_Koninklijke_Bibliotheek_wordmark.svg" alt="KB Logo" width="50">
                            <i>Portraits from the collections of KB, the national library of the Netherlands</i>
                            <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/Wikipedia-logo-v2.svg" alt="Wikipedia Logo" width="50">
                        </div>
                        <img class="zoomable" src="${portrait.imageUrl}" alt="Portrait of ${portrait.title}" loading="lazy">
                        <div class="overlay" role="contentinfo">
                            <h2><a href="${portrait.wikipediaLink}" target="_blank">${portrait.title}</a></h2>
                            <p>${portrait.description}</p>
                        </div>
                    </div>`;
            }

            function nextRandomPortrait() {
                const randomIndex = Math.floor(Math.random() * portraits.length);
                history.push(randomIndex);
                currentIndex = history.length - 1;
                displayPortrait(portraits[randomIndex]);
            }

            let debounceTimer;
            window.addEventListener('wheel', (event) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    event.deltaY > 0 ? nextRandomPortrait() : previousPortrait();
                }, 200);
            });

            function previousPortrait() {
                if (currentIndex > 0) {
                    currentIndex--;
                    displayPortrait(portraits[history[currentIndex]]);
                }
            }

            fetchPortraits();
        });
    </script>
</body>
</html>
