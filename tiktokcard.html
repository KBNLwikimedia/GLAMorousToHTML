<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portraits from the collections of KB, national library of the Netherlands</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Source Sans Pro', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .tiktok-card {
            width: 100%;
            height: 100vh;
            background-color: #1e1e1e;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .zoomable {
            width: 100%;
            height: 100%;
            object-fit: cover;
            touch-action: none;
            transition: transform 0.2s ease;
        }
        .top-overlay {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 5px;
            font-size: 16px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-style: italic;
        }
        .top-overlay img {
            width: 50px;
            height: auto;
        }
        .overlay {
            position: absolute;
            top: 80%;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .overlay h2, .overlay p {
            margin: 5px 0;
        }
        .overlay a {
            color: #EF6079;
            text-decoration: underline;
            font-weight: 600;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Loading portraits...</div>
    <div id="portrait-container" style="display:none"></div>

    <script>
        let portraits = [];
        let history = [];
        let currentIndex = -1;
        let startX = 0;
        let startY = 0;
        let scale = 1;
        let initialDistance = 0;
        let isZooming = false;

        async function fetchPortraits() {
            try {
                const response = await fetch('tiktokcard-datacache.csv');
                const text = await response.text();
                const lines = text.split('\n').slice(1);

                portraits = lines.map(line => {
                    const [imageUrl, title, description, wikipediaLink] = line.split(';');
                    return { imageUrl, title, description, wikipediaLink };
                }).filter(portrait => portrait.imageUrl);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('portrait-container').style.display = 'block';
                nextRandomPortrait();
            } catch (error) {
                document.getElementById('loading').innerText = 'Failed to load portraits.';
                console.error('Error loading CSV data:', error);
            }
        }

        function displayPortrait(portrait) {
            const container = document.getElementById('portrait-container');
            container.innerHTML = `
                <div class="tiktok-card">
                    <div class="top-overlay">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Logo_Koninklijke_Bibliotheek_wordmark.svg/143px-Logo_Koninklijke_Bibliotheek_wordmark.svg.png" alt="KB Logo">
                        <i>Portraits from the collections of KB, national library of the Netherlands</i>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/103px-Wikipedia-logo-v2.svg.png" alt="Wikipedia Logo">
                    </div>
                    <img class="zoomable" src="${portrait.imageUrl}" alt="Portrait of ${portrait.title}" loading="lazy">
                    <div class="overlay">
                        <h2><a href="${portrait.wikipediaLink}" target="_blank">${portrait.title}</a></h2>
                        <p>${portrait.description}</p>
                    </div>
                </div>`;

            const image = document.querySelector('.zoomable');
            image.addEventListener('touchstart', handleTouchStart, { passive: false });
            image.addEventListener('touchmove', handleTouchMove, { passive: false });
            image.addEventListener('touchend', handleTouchEnd);
        }

        function nextRandomPortrait() {
            const randomIndex = Math.floor(Math.random() * portraits.length);
            history.push(randomIndex);
            currentIndex = history.length - 1;
            displayPortrait(portraits[randomIndex]);
        }

        function previousPortrait() {
            if (currentIndex > 0) {
                currentIndex--;
                displayPortrait(portraits[history[currentIndex]]);
            }
        }

        function handleTouchStart(event) {
            if (event.touches.length === 2) {
                isZooming = true;
                initialDistance = getDistance(event.touches[0], event.touches[1]);
            }
        }

        function handleTouchMove(event) {
            if (event.touches.length === 2) {
                event.preventDefault();
                const currentDistance = getDistance(event.touches[0], event.touches[1]);
                scale = currentDistance / initialDistance;
                event.target.style.transform = `scale(${scale})`;
            }
        }

        function handleTouchEnd(event) {
            if (isZooming && event.touches.length < 2) {
                isZooming = false;
            }
        }

        function getDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        window.addEventListener('wheel', (event) => {
            if (!isZooming) {
                event.deltaY < 0 ? previousPortrait() : nextRandomPortrait();
            }
        });

        window.addEventListener('keydown', (event) => {
            if (!isZooming) {
                if (event.key === 'ArrowUp') previousPortrait();
                if (event.key === 'ArrowDown') nextRandomPortrait();
            }
        });

        fetchPortraits();
    </script>
</body>
</html>
